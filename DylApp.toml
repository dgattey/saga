# Saga app manifest, read by devkit, release-kit and @dylkit/web.
# Schema: DylKit's Sources/DylManifest/DylAppManifest.swift. `./run dev checks` validates it.

[app]
name = "Saga"
bundle-id = "com.dylangattey.Saga"
platforms = { macos = "26.0", ios = "26.0" }
category = "public.app-category.productivity"

[build]
product = "Saga"
entitlements = "Saga.entitlements"
resources = ["Sources/Saga/Saga.xcdatamodeld", "Sources/Saga/Assets.xcassets"]
icon = "Sources/Saga/AppIcon.icon"
accent-color = "AccentColor"

# Contentful credentials for dev builds. Releases ship the defaults; `./run bootstrap` writes the file from 1Password.
[local-values]
file = "Config.xcconfig"
keys = { ContentfulSpaceId = "CONTENTFUL_SPACE_ID", ContentfulAccessToken = "CONTENTFUL_ACCESS_TOKEN", SagaAPISecret = "SAGA_API_SECRET" }
defaults = { ContentfulSpaceId = "placeholder", ContentfulAccessToken = "placeholder", SagaAPISecret = "" }

[ios]
simulator = "iPhone 17 Pro"

[ios.info]
UIApplicationSceneManifest = { UIApplicationSupportsMultipleScenes = true }
UIApplicationSupportsIndirectInputEvents = true
UIStatusBarStyle = "UIStatusBarStyleDefault"
"UISupportedInterfaceOrientations~iphone" = ["UIInterfaceOrientationPortrait", "UIInterfaceOrientationLandscapeLeft", "UIInterfaceOrientationLandscapeRight"]
"UISupportedInterfaceOrientations~ipad" = ["UIInterfaceOrientationPortrait", "UIInterfaceOrientationPortraitUpsideDown", "UIInterfaceOrientationLandscapeLeft", "UIInterfaceOrientationLandscapeRight"]

[release]
sparkle-public-key = "sparkle-public-key.txt"
site-url = "https://saga.gattey.com"
assets = "https://replacewithsagastore.public.blob.vercel-storage.com"
artifacts-dir = "server/public"
check-interval = 3600

# Read by @dylkit/web for saga.gattey.com. Screenshot paths are under release.artifacts-dir.
[site]
tagline = "Your personal reading log for macOS and iOS: track books, reading status, star ratings, public reviews and private notes, synced with Contentful and Goodreads."
accent = { light = "#264e3a", dark = "#4a7e65" }
screenshots = [
    { src = "saga-preview-light.png", dark-src = "saga-preview.png", alt = "Saga book library and reading tracker on macOS showing editorial reviews, private notes, and the Currently reading sidebar card" },
]
