name: Build
description: Build the macOS app with xcodebuild (without code signing)

outputs:
  result:
    description: "'pass' if build succeeds, 'fail' otherwise"
    value: ${{ steps.build_result.outputs.result }}

runs:
  using: composite
  steps:
    # Config.xcconfig is gitignored, and Xcode treats a missing base configuration
    # file as a hard error. Compiling never contacts Contentful, so stand-ins are enough.
    - name: Write placeholder Config.xcconfig
      shell: bash
      run: |
        set -euo pipefail
        ./run config --placeholder --if-missing

    # Compiles the release check that only runs at merge time, and fails on a bad
    # SUPublicEDKey or SUFeedURL, or diverging MACOSX_DEPLOYMENT_TARGETs.
    - name: Check release config
      shell: bash
      run: |
        set -euo pipefail
        ./run release-check min-os

    - name: Build app
      id: run_build
      shell: bash
      run: |
        set -euo pipefail
        ./run app --build-only --skip-signing

    - name: Run unit tests
      id: run_tests
      shell: bash
      run: |
        set -euo pipefail
        ./run app --test --skip-signing

    - name: Record build result
      id: build_result
      if: always()
      shell: bash
      run: |
        if [[ "${{ steps.run_build.outcome }}" == "success" && "${{ steps.run_tests.outcome }}" == "success" ]]; then
          echo "result=pass" >> "$GITHUB_OUTPUT"
        else
          echo "result=fail" >> "$GITHUB_OUTPUT"
          echo "::error::Build or unit tests failed. Run './run app --build-only' and './run app --test' locally to debug."
          exit 1
        fi
