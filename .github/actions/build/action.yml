name: Build
description: Build Saga.app with SwiftPM and run the unit tests

outputs:
  result:
    description: "'pass' if build succeeds, 'fail' otherwise"
    value: ${{ steps.build_result.outputs.result }}

runs:
  using: composite
  steps:
    - name: Build app
      id: run_build
      shell: bash
      run: |
        set -euo pipefail
        ./run app --build-only

    - name: Run unit tests
      id: run_tests
      shell: bash
      run: |
        set -euo pipefail
        ./run app --test

    - name: Record build result
      id: build_result
      if: always()
      shell: bash
      run: |
        if [[ "${{ steps.run_build.outcome }}" == "success" && "${{ steps.run_tests.outcome }}" == "success" ]]; then
          echo "result=pass" >> "$GITHUB_OUTPUT"
        else
          echo "result=fail" >> "$GITHUB_OUTPUT"
          echo "::error::Build or unit tests failed. Run './run app --build-only' and './run app --test' locally to debug."
          exit 1
        fi
