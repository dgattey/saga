name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: 🎨 Format
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: swift-format
        run: ./run format --check

  lint:
    name: 🔍 Lint
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-lint-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-lint-${{ runner.os }}-
      - uses: jdx/mise-action@v2
        with:
          install_args: swiftlint
      - name: Manifest, SwiftLint, dyl-lint and release checks
        run: ./run dev checks

  build:
    name: 🔨 Build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-build-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-build-${{ runner.os }}-
      - name: Build build/Saga.app
        run: ./run dev build
      - name: Unit tests
        run: swift test

  ios:
    name: 📱 iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Screenshot main screens on iPhone and iPad
        run: ./run ui
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: build/captures/*.png
          if-no-files-found: ignore

  site:
    name: 🌐 Site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install, typecheck and build
        run: |
          npm ci
          npm run typecheck
          npm run build
