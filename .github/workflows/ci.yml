name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🔍 Lint
    runs-on: macos-latest
    timeout-minutes: 20
    outputs:
      ui_changed: ${{ steps.changes.outputs.ui_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect UI changes
        id: changes
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- Sources scripts/ui-screenshots.sh scripts/ui-fixture-store.swift Package.swift Package.resolved; then
            echo "ui_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "ui_changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: swift-format
        run: swift format lint --strict --recursive --parallel Sources Tests Package.swift scripts
      - uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-lint-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-lint-${{ runner.os }}-
      - uses: jdx/mise-action@v2
        with:
          install_args: swiftlint
      - name: Manifest, SwiftLint, dyl-lint and release checks
        run: swift run devkit checks
      - name: Release checks, notes check, and release-kit dry run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          swift run release-kit check
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.body // ""' > "$RUNNER_TEMP/pr-body.md"
          swift run release-kit notes --check --body-file "$RUNNER_TEMP/pr-body.md"
          swift run release-kit version --pr "$PR_NUMBER"
          swift run release-kit notes
          rm -rf build/release

  build:
    name: 🔨 Build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-build-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-build-${{ runner.os }}-
      - name: Build build/Saga Dev.app
        run: swift run devkit build
      - name: Unit tests
        run: swift test

  ios:
    name: 📱 iOS Simulator
    needs: [lint, build]
    if: needs.lint.outputs.ui_changed == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-lint-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-lint-${{ runner.os }}-
      - name: Screenshot main screens on iPhone and iPad
        run: scripts/ui-screenshots.sh
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: build/captures/*.png
          if-no-files-found: ignore

  web:
    name: 🌐 Web (saga.gattey.com)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: server/.node-version
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - name: Verify web icons & preview assets match AppIcon.icon
        run: ./scripts/sync-web-icons.sh --check
      - name: Install, test, typecheck, and build server/
        working-directory: server
        run: |
          pnpm install
          pnpm test
          pnpm typecheck
          pnpm build
