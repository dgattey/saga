name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  bump:
    name: 📦 Bump version
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR release info
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if printf '%s\n' "$PR_BODY" | grep -qiE '^[[:space:]]*-[[:space:]]*\[[xX]\][[:space:]]*Major\b'; then
            release_type="major"
          elif printf '%s\n' "$PR_BODY" | grep -qiE '^[[:space:]]*-[[:space:]]*\[[xX]\][[:space:]]*Minor\b'; then
            release_type="minor"
          else
            release_type="patch"
          fi
          echo "Release bump type: ${release_type} (version and build are computed at release time on merge)"

  format:
    name: 🎨 Format
    runs-on: macos-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check formatting
        uses: ./.github/actions/format

  lint:
    name: 🔍 Lint
    runs-on: macos-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint
        uses: ./.github/actions/lint

  build:
    name: 🔨 Build
    runs-on: macos-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build
        uses: ./.github/actions/build
