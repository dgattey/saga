name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  bump:
    name: 📦 Bump version
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR release info
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if printf '%s\n' "$PR_BODY" | grep -qiE '^[[:space:]]*-[[:space:]]*\[[xX]\][[:space:]]*Major\b'; then
            release_type="major"
          elif printf '%s\n' "$PR_BODY" | grep -qiE '^[[:space:]]*-[[:space:]]*\[[xX]\][[:space:]]*Minor\b'; then
            release_type="minor"
          else
            release_type="patch"
          fi
          echo "Release bump type: ${release_type} (version and build are computed at release time on merge)"

  format:
    name: 🎨 Format
    runs-on: macos-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check formatting
        uses: ./.github/actions/format

  lint:
    name: 🔍 Lint
    runs-on: macos-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint
        uses: ./.github/actions/lint

  build:
    name: 🔨 Build
    runs-on: macos-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build
        uses: ./.github/actions/build

  ios:
    name: 📱 iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7

      - name: Build iOS Simulator app
        run: ./scripts/build-ios-sim.sh

      - name: Screenshot main screens on iPhone and iPad
        run: ./scripts/ui-screenshots.sh --no-build

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: build/captures/*.png
          if-no-files-found: ignore

  release-artifact:
    name: 📦 Release artifact
    runs-on: macos-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags

      # Same steps as release.yml, minus publishing, so every PR proves it would ship a valid
      # Sparkle update for installs of the latest published release.
      - name: Package release and verify against the latest published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_ED_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_ED_PRIVATE_KEY_BASE64 }}
          SAGA_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          read_output="$(./run version-and-release read --event "$GITHUB_EVENT_PATH")"
          version="$(echo "$read_output" | awk -F= '/^VERSION=/{print $2}')"
          build="$(echo "$read_output" | awk -F= '/^BUILD=/{print $2}')"
          ./run version-and-release package --version "$version" --build "$build" --output-dir dist/release
          ./scripts/verify-release.sh "dist/release/Saga-${version}.zip" dist/release/appcast.xml
