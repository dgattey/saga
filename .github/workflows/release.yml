name: Release

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'DylApp.toml'
      - 'Saga.entitlements'
      - 'sparkle-public-key.txt'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Bump type; auto reads the merged PR''s Release info checkbox'
        required: false
        default: auto
        type: choice
        options: [auto, patch, minor, major]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: 🚀 Release
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the merged PR's body
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ci/github/pr-body.sh "$GITHUB_SHA" "$RUNNER_TEMP/pr-body.md"
      - name: Plan the version
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -o pipefail
          ./run release version --type "${RELEASE_TYPE:-auto}" --pr-body-file "$RUNNER_TEMP/pr-body.md" \
            | tee -a "$GITHUB_OUTPUT"
      - name: Bundle
        run: ./run release bundle
      - name: Sign
        run: ./run release sign
      - name: Appcast
        env:
          SPARKLE_ED_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_ED_PRIVATE_KEY_BASE64 }}
        run: ./run release appcast
      - name: Check against the live release
        run: ./run release check --live
      # Pushes the v<version> tag and deploys the site with the new appcast and zip. Nothing is committed.
      - name: Publish
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: ./run release publish

  # Waiting for the deploy is plain polling, so it runs on ubuntu instead of billing macOS minutes.
  live-site:
    name: 🌐 Live feed
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 17
    permissions: {}
    steps:
      - name: Wait for the site to serve the release
        env:
          FEED: https://saga.gattey.com/appcast.xml
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          for _ in $(seq 60); do
            if curl -fsSL "$FEED" | grep -qF "<sparkle:shortVersionString>$VERSION<"; then
              echo "$FEED serves $VERSION"
              exit 0
            fi
            sleep 15
          done
          echo "::error::$FEED didn't serve $VERSION within 15 minutes"
          exit 1
