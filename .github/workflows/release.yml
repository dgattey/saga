name: Release

on:
  pull_request:
    types: [closed]

jobs:
  release:
    name: 🚀 Release
    if: github.event.pull_request.merged == true
    runs-on: macos-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags

      - name: Read version/build from project
        id: version
        run: |
          set -euo pipefail
          read_output="$(./run version-and-release read --path "${{ vars.PBXPROJ_PATH }}" --event "$GITHUB_EVENT_PATH")"
          version="$(echo "$read_output" | awk -F= '/^VERSION=/{print $2}')"
          build="$(echo "$read_output" | awk -F= '/^BUILD=/{print $2}')"
          if [[ -z "$version" || -z "$build" ]]; then
            echo "Failed to read version/build" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        id: notes
        run: |
          set -euo pipefail
          notes="$(./run version-and-release extract-notes --event "$GITHUB_EVENT_PATH")"
          sparkle_notes="$(./run version-and-release extract-notes --event "$GITHUB_EVENT_PATH" --sparkle)"
          delimiter="NOTES_$(uuidgen)"
          sparkle_delimiter="SPARKLE_NOTES_$(uuidgen)"
          {
            echo "notes<<$delimiter"
            echo "$notes"
            echo "$delimiter"
            echo "sparkle_notes<<$sparkle_delimiter"
            echo "$sparkle_notes"
            echo "$sparkle_delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Build and package macOS release + Sparkle appcast
        id: package
        env:
          SPARKLE_ED_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_ED_PRIVATE_KEY_BASE64 }}
          SAGA_RELEASE_NOTES: ${{ steps.notes.outputs.sparkle_notes }}
          SAGA_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ./run version-and-release package \
            --version "${{ steps.version.outputs.version }}" \
            --build "${{ steps.version.outputs.build }}" \
            --output-dir "dist/release"

      - name: Create GitHub release
        id: release
        uses: actions/github-script@v9
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          NOTES: ${{ steps.notes.outputs.notes }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = `v${process.env.VERSION}`;
            const body = process.env.NOTES || "";
            try {
              const existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.info(`Release ${tag} already exists, skipping creation.`);
              core.setOutput('release_url', existing.data.html_url);
              return;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }
            const { data: created } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: tag,
              body,
              target_commitish: context.payload.pull_request.merge_commit_sha
            });
            core.setOutput('release_url', created.html_url);

      - name: Upload macOS release archive and Sparkle appcast.xml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release upload "v${VERSION}" \
            "dist/release/Saga-${VERSION}.zip" \
            "dist/release/appcast.xml" \
            --clobber

      - name: Post PR released comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
        run: |
          ./run version-and-release pr-comment --event "$GITHUB_EVENT_PATH" --version "${{ steps.version.outputs.version }}" --state released
