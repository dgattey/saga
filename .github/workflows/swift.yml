name: Swift

on:
  push:
    branches: [main]

jobs:
  format:
    name: 🎨 Format
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check formatting
        uses: ./.github/actions/format

  lint:
    name: 🔍 Lint
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint
        uses: ./.github/actions/lint
